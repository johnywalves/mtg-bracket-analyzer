version: '3.8'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - VITE_API_URL=${API_URL:-http://api:8000}
      - VITE_API_KEY=${API_KEY}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # No expose/ports published: the api stays internal-only, reachable by
    # `web` over the Docker network Coolify injects. Never routed by Traefik.
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - mtg_data:/app/data

volumes:
  mtg_data:
    name: mtg_data_vol
