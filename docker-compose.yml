version: '3.8'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - VITE_API_URL=${API_URL:-http://api:8000}
      - VITE_API_KEY=${API_KEY}
    networks:
      - mtg_network
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - mtg_data:/app/data
    networks:
      - mtg_network

networks:
  mtg_network:
    driver: bridge

volumes:
  mtg_data:
    name: mtg_data_vol
