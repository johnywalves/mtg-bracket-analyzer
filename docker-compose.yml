version: '3.8'

services:
  web_bracket:
    build:
      context: .
      dockerfile: web/Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - MTG_API_URL=${API_URL:-http://api_bracket:8000}
      - MTG_API_KEY=${API_KEY}
    volumes:
      - mtg_card_image_cache:/app/web/.cache/card-images
    depends_on:
      - api_bracket

  api_bracket:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # No expose/ports published: the api stays internal-only, reachable by
    # `web_bracket` over the Docker network Coolify injects. Never routed by Traefik.
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - mtg_data:/app/data

volumes:
  mtg_data:
    name: mtg_data_vol
  mtg_card_image_cache:
    name: mtg_card_image_cache_vol
